# Deploy contract for g1_v28 (zealot-native trainer, nexus GPU physics).
# Mirrors the role of Isaac's env.yaml in earlier releases; field names follow
# the zealot RobotSpec / run configuration, not Isaac Lab.

robot: unitree_g1_29dof_agile   # 29-DOF G1, wrist pitch/yaw welded (31 nv)
policy_dof: 12                  # legs only; upper body is PD-held
control_hz: 50                  # decimation 4 @ 200 Hz physics
action:
  mapping: "q_target = default_pos + action_scale * action, clamped to joint limits"
  action_scale: 0.5

# Canonical action/obs joint order (left leg, then right leg).
joints:
  - {name: left_hip_pitch_joint,   default_pos: -0.1, kp: 100, kd: 2.5, limits: [-2.5307, 2.8798]}
  - {name: left_hip_roll_joint,    default_pos:  0.0, kp: 100, kd: 2.5, limits: [-0.5236, 2.9671]}
  - {name: left_hip_yaw_joint,     default_pos:  0.0, kp: 100, kd: 2.5, limits: [-2.7576, 2.7576]}
  - {name: left_knee_joint,        default_pos:  0.3, kp: 200, kd: 5.0, limits: [-0.087267, 2.8798]}
  - {name: left_ankle_pitch_joint, default_pos: -0.2, kp:  40, kd: 2.0, limits: [-0.87267, 0.5236]}
  - {name: left_ankle_roll_joint,  default_pos:  0.0, kp:  40, kd: 2.0, limits: [-0.2618, 0.2618]}
  - {name: right_hip_pitch_joint,  default_pos: -0.1, kp: 100, kd: 2.5, limits: [-2.5307, 2.8798]}
  - {name: right_hip_roll_joint,   default_pos:  0.0, kp: 100, kd: 2.5, limits: [-2.9671, 0.5236]}
  - {name: right_hip_yaw_joint,    default_pos:  0.0, kp: 100, kd: 2.5, limits: [-2.7576, 2.7576]}
  - {name: right_knee_joint,       default_pos:  0.3, kp: 200, kd: 5.0, limits: [-0.087267, 2.8798]}
  - {name: right_ankle_pitch_joint,default_pos: -0.2, kp:  40, kd: 2.0, limits: [-0.87267, 0.5236]}
  - {name: right_ankle_roll_joint, default_pos:  0.0, kp:  40, kd: 2.0, limits: [-0.2618, 0.2618]}
# NOTE: ankle gains are the v19+ deploy package (40/2.0), overriding the AGILE
# table's 20/0.2 — the run trained with BIPED_ANKLE_KP=40 BIPED_ANKLE_KD=2.0.

# Upper body: NOT policy-controlled; PD-held at rest pose with the deploy table.
held_joints:
  waist_yaw:      {kp: 300, kd: 5.0}
  waist_roll:     {kp: 300, kd: 5.0}
  waist_pitch:    {kp: 300, kd: 5.0}
  shoulder_pitch: {kp:  90, kd: 2.0}
  shoulder_roll:  {kp:  60, kd: 1.0}
  shoulder_yaw:   {kp:  20, kd: 0.4}
  elbow:          {kp:  60, kd: 1.0}
  wrist_roll:     {kp:   4, kd: 0.2}
# Trained with arm-motion playback (sonic-motions dataset) on the held arms.

observation:
  dim: 265                      # 5-frame history x 53
  history_length: 5
  # Single-frame layout + normalizer are baked into policy.onnx; the reference
  # obs builder is zealot examples/biped/sim2sim_xval.py (mind its documented
  # lag-2 last_action convention).

commands:
  vx_range: [-0.8, 0.8]
  gait_speed_cap: 0.8
  slow_prob: 0.5

training_env:                   # for reference / DR reproduction
  physics: nexus (native CUDA), solver_iters 4, contact NF 240, contact DR on
  num_envs: 4096
  motor_delay_substeps: [0, 4]
  push_vel: 0.5                 # m/s, random torso kicks
  push_angvel: 0.25             # rad/s
  terrain: curriculum, slopes up to 26.8% grade
  agile_dr: true                # AGILE-parity domain randomization
  base_height_target: 0.82      # 0.83 standing
  mirror_augmentation: true
  contact_sense: force-based foot contact, 1 N threshold
